<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avails social image source</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Public Sans", sans-serif; }
      .social-preview {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 64px;
        background: var(--cibc-color-page);
        color: var(--cibc-color-text);
      }
      .identity { display: flex; align-items: center; gap: 18px; }
      .identity img { width: 64px; height: 64px; }
      .wordmark { font-size: 54px; font-weight: 700; letter-spacing: -0.03em; }
      h1 { max-width: 610px; margin: 76px 0 20px; font-size: 64px; font-weight: 700; line-height: 1.06; letter-spacing: -0.03em; }
      p { margin: 0; font-size: 28px; line-height: 1.4; }
      .address { position: absolute; bottom: 52px; left: 64px; font-size: 23px; }
      .slot-field {
        position: absolute;
        top: 80px;
        right: 64px;
        width: 360px;
        height: 470px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(14, 1fr);
        background: color-mix(in srgb, var(--cibc-color-action) 10%, var(--cibc-color-surface));
      }
      .slot { position: relative; }
      .slot::after { content: ''; position: absolute; inset: 1px 2px; border-radius: 2px; background: var(--cibc-color-surface); }
      .slot::before { content: ''; position: absolute; inset: 0; z-index: 1; background: color-mix(in srgb, var(--cibc-color-action) var(--paint), transparent); }
    </style>
  </head>
  <body>
    <main class="social-preview">
      <div class="identity"><img src="/favicon.svg" alt="" /><span class="wordmark">Avails</span></div>
      <h1>Find a time your whole group can actually meet</h1>
      <p>Free, open scheduling polls.</p>
      <p class="address">avails.citizeninfra.org</p>
      <div class="slot-field" aria-hidden="true"></div>
    </main>
    <script type="module">
      import '@citizen-infra/design-system/fonts.css'
      import '@citizen-infra/design-system/tokens.css'
      import { slotOpacity } from '../src/lib/gridPresentation.js'

      // Fixed geometric illustration, never derived from a poll or a response.
      const bands = [[1, 3, 0, 2], [2, 5, 6, 3], [0, 2, 4, 1], [1, 1, 0, 0]]
      const field = document.querySelector('.slot-field')
      for (let row = 0; row < 14; row++) {
        const band = bands[row < 4 ? 0 : row < 9 ? 1 : row < 12 ? 2 : 3]
        for (const layers of band) {
          const slot = document.createElement('div')
          slot.className = 'slot'
          slot.style.setProperty('--paint', `${slotOpacity(layers) * 100}%`)
          field.append(slot)
        }
      }
    </script>
  </body>
</html>
