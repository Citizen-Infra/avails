name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v4 of both ran on Node 20, which GitHub deprecated — every run was
      # force-migrated to Node 24 and printed a warning. v5 is where each moved
      # to Node 24 properly; v7 is current.
      #
      # Two breaking changes on the way here could have bitten and don't:
      # setup-node v5 starts auto-caching when package.json carries a
      # `packageManager` field (none of ours does), and checkout v7 blocks fork
      # checkouts for `pull_request_target`/`workflow_run` (this workflow runs on
      # `push`/`pull_request`). Re-check both if either of those changes.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Read from .node-version rather than repeating 22 here. The file
          # already existed and this duplicated it, which is one edit away from
          # CI and local dev building on different Node without anyone noticing.
          node-version-file: .node-version
          # Both workspaces — each has its own lockfile, and caching only one
          # would silently leave the other reinstalling from the network.
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      # npm ci, not npm install (#123). It installs exactly the lockfile, so a
      # transitive bump cannot quietly make CI test something other than what
      # deploys, and it FAILS on lockfile drift rather than papering over it —
      # which is the point, not a side effect.
      - name: Install client dependencies
        run: cd client && npm ci
      - name: Build client
        run: cd client && npm run build
      - name: Install server dependencies
        run: cd server && npm ci
      - name: Server tests
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/server-tests.log
          # `node --test` exits 0 reporting "pass 0" when its pattern matches no
          # files — so a glob that stops expanding (different Node version, moved
          # directory, renamed files) would leave this step green having run
          # nothing at all. Fail loudly instead.
          grep -qE 'pass [1-9]' /tmp/server-tests.log \
            || { echo "::error::No tests ran — check the test glob in server/package.json"; exit 1; }
      - name: Check server syntax
        run: find server/src -name '*.js' -not -path '*/lexicons/*' -exec node --check {} +
